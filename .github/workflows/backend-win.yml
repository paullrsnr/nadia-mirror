name: Build backend Windows

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build exe (pyinstaller)
        shell: powershell
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller nadia-backend.spec
          mkdir -Force dist\win
          move dist\nadia-backend.exe dist\win\nadia-backend.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nadia-backend-windows
          path: backend/dist/win/nadia-backend.exe
