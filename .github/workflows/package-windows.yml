name: Package Windows

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build backend (Windows)
        shell: pwsh
        run: scripts/build/backendWindows.ps1

      - name: Build & package Electron (Windows)
        shell: pwsh
        run: scripts/package/windowsGithub.ps1

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: nadia-windows
          path: desktop/dist/*.exe
