[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nadia-backend"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
  "fastapi>=0.128",
  "uvicorn[standard]>=0.40",
  "pydantic>=2.12.5"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test*.py", "test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]