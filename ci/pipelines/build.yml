# A déplacer dans scripts pour mettre au propre plus tard
build:
  stage: build
  image: node:22-bullseye

  before_script:
    - node --version
    - npm --version
    - python3 --version
    - apt-get update
    - apt-get install -y python3-pip python3-venv
    - python3 -m pip --version

  script:
    - cd desktop
    - npm install
    - npm run build
    - cd ..

    - cd backend
    - python3 -m venv .venv
    - . .venv/bin/activate
    - python3 -m pip install -r requirements.txt
    - python3 -m pip install pyinstaller
    - pyinstaller nadia-backend.spec

  artifacts:
    name: "build-artifacts"
    expire_in: 1 day
    paths:
      - desktop/dist/
      - backend/dist/nadia-backend
