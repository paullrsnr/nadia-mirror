stages:
  - build

############################
# BACKEND WINDOWS
############################
build:backend:windows:
  stage: build
  image:
    name: cdrx/pyinstaller-windows:python3
    entrypoint: [""]

  script:
    - echo "=== Building Windows backend ==="
    - cd backend

    - python --version
    - pip --version

    - pip install -r requirements.txt
    - pyinstaller nadia-backend.spec

    - mkdir -p dist/current
    - mv dist/nadia-backend.exe dist/current/

    - echo "=== Windows backend build finished ==="

  artifacts:
    expire_in: 1 day
    paths:
      - backend/dist/current/nadia-backend.exe

############################
# BACKEND MACOS
############################
build:backend:macos:
  stage: build
  tags:
    - shell

  script:
    - cd backend
    - python3 -m venv .venv
    - . .venv/bin/activate
    - pip install -r requirements.txt
    - pip install pyinstaller
    - pyinstaller nadia-backend.spec
    - mkdir -p dist/current
    - mv dist/nadia-backend dist/current/

  artifacts:
    expire_in: 1 day
    paths:
      - backend/dist/current

############################
# DESKTOP (FRONT + MAIN)
############################
build:desktop:
  stage: build
  image: node:22-bullseye

  script:
    - cd desktop
    - npm install
    - npm run build

  artifacts:
    expire_in: 1 day
    paths:
      - desktop/dist
