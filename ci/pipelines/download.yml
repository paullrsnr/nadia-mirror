download:backend-binary:windows:
  stage: download
  image: alpine:3.20

  before_script:
    - apk add --no-cache curl jq unzip

  script:
    - echo "🔍 Waiting for GitHub Actions run for commit $CI_COMMIT_SHA"

    # 1️⃣ Attendre que le workflow GitHub soit terminé pour ce commit
    - |
      for i in 1 2 3 4 5 6; do
        RUN_ID=$(curl -sS \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/paullrsnr/nadia-mirror/actions/runs?per_page=50" \
          | jq -r --arg sha "$CI_COMMIT_SHA" \
            '.workflow_runs[] | select(.head_sha==$sha and .status=="completed") | .id' \
          | head -n 1)

        if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
          echo "✅ Found GitHub Actions run: $RUN_ID"
          break
        fi

        echo "⏳ GitHub run not ready yet, retrying in 20s... ($i/6)"
        sleep 20
      done

      if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
        echo "❌ No completed GitHub Actions run found for commit $CI_COMMIT_SHA"
        exit 1
      fi

    # 2️⃣ Récupérer l’artifact Windows
    - echo "📦 Fetching artifact id"
    - |
      ART_ID=$(curl -sS \
        -H "Authorization: Bearer $GITHUB_TOKEN" \
        -H "Accept: application/vnd.github+json" \
        "https://api.github.com/repos/paullrsnr/nadia-mirror/actions/runs/$RUN_ID/artifacts" \
        | jq -r '.artifacts[] | select(.name=="nadia-backend-windows") | .id' \
        | head -n 1)

      if [ -z "$ART_ID" ] || [ "$ART_ID" = "null" ]; then
        echo "❌ Artifact 'nadia-backend-windows' not found for run $RUN_ID"
        exit 1
      fi

      echo "✅ Artifact id: $ART_ID"

    # 3️⃣ Télécharger et extraire l’exe
    - mkdir -p backend/dist/win
    - echo "⬇️ Downloading artifact..."
    - |
      curl -L -sS \
        -H "Authorization: Bearer $GITHUB_TOKEN" \
        -H "Accept: application/vnd.github+json" \
        "https://api.github.com/repos/paullrsnr/nadia-mirror/actions/artifacts/$ART_ID/zip" \
        -o artifact.zip

    - unzip -o artifact.zip -d backend/dist/win
    - ls -la backend/dist/win

  artifacts:
    expire_in: 1 day
    paths:
      - backend/dist/win/nadia-backend.exe
