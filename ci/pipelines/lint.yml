############################
# BACKEND PYTHON (pylint)
############################
lint:backend:
  stage: lint
  image: python:3.12-slim

  before_script:
    - cd backend
    - pip install pylint
    - pip install -r requirements.txt

  script:
    - cd backend
    - pylint --fail-under=9 .

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - backend/**/*

############################
# DESKTOP TYPESCRIPT (ESLint)
############################
lint:desktop:
  stage: lint
  image: node:22-bullseye

  before_script:
    - cd desktop
    - npm ci

  script:
    - cd desktop
    - npm run lint

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - desktop/**/*
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - desktop/**/*
