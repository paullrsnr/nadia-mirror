# A ranger dans scripts pour mettre au propre plus tard
package:windows:
  stage: package
  image: electronuserland/builder:wine

  needs:
    - job: build
      artifacts: true

  variables:
    ELECTRON_CACHE: "$CI_PROJECT_DIR/.cache/electron"
    ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.cache/electron-builder"

  before_script:
    - node --version
    - npm --version

  script:
    - cd desktop

    - npm install --ignore-scripts

    - npm run pack

  artifacts:
    name: "nadia-windows"
    expire_in: 7 days
    paths:
      - "desktop/dist/*.exe"
      - "desktop/dist/*.msi"

package:macos:
  stage: package
  tags:
    - shell

  needs:
    - job: build
      artifacts: true

  before_script:
    - export NVM_DIR="$HOME/.nvm" # un peu dommage de pas pouvoir le faire direct sur la machine
    - [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
    - nvm use 22
    - node --version
    - npm --version

  script:
    - cd desktop
    - npm install
    - npm run pack

  artifacts:
    name: "nadia-macos"
    expire_in: 7 days
    paths:
      - "desktop/dist/*.dmg"
