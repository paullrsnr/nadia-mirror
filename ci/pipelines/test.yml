############################
# BACKEND PYTHON (pytest)
############################
test:backend:
  stage: test
  image: python:3.12-slim

  before_script:
    - cd backend
    - pip install -r requirements.txt

  script:
    - cd backend
    - pytest tests/ -v --tb=short

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - backend/**/*

  coverage: '/TOTAL.*\s+(\d+%)$/'